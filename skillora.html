<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skillora AI — твои навыки. Твой опыт. Твоё будущее.</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3f1;--s:#fffdfc;--t:#3b2a2f;--m:#7a666b;--l:#ecd9d8;--a:#b4636f;--b:#5f9c86;--g:linear-gradient(120deg,#b4636f,#d08a95);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231a1d;--s:#2e2226;--t:#f8ebec;--m:#c7acb1;--l:#43343a;--a:#dd8f9c;--b:#8cc9b2;--g:linear-gradient(120deg,#c77582,#dd9aa5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#231a1d;--s:#2e2226;--t:#f8ebec;--m:#c7acb1;--l:#43343a;--a:#dd8f9c;--b:#8cc9b2;--g:linear-gradient(120deg,#c77582,#dd9aa5);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:400 15px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.w{max-width:980px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--l)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0}
.logo{font-weight:800;font-size:19px}.logo span{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--l);background:var(--s);color:var(--t);font:600 13px Manrope,sans-serif;padding:8px 14px;border-radius:10px;cursor:pointer}
.tab.on{background:var(--g);color:#fff;border-color:transparent}
h2{font-size:22px;margin:26px 0 6px;letter-spacing:-.01em}
.sub{color:var(--m);margin:0 0 16px}
.card{background:var(--s);border:1px solid var(--l);border-radius:16px;padding:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--a) 14%,transparent);color:var(--a);margin-right:6px}
.chip.g{background:color-mix(in srgb,var(--b) 16%,transparent);color:var(--b)}
.card h3{margin:8px 0 4px;font-size:16px}.card p{margin:0 0 10px;color:var(--m);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:0;cursor:pointer;font:600 14px Manrope,sans-serif;padding:10px 18px;border-radius:10px;background:var(--g);color:#fff}
.btn.o{background:transparent;color:var(--t);border:1px solid var(--l)}
input,select,textarea{font:inherit;width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:var(--t);margin-bottom:10px}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;font-weight:600;color:var(--m);display:block;margin-bottom:4px}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.hero{background:var(--g);color:#fff;border-radius:20px;padding:22px;margin-top:20px}
.hero .card{color:var(--t)}
.hero h1{margin:0 0 4px;font-size:22px}.hero p{margin:0 0 14px;opacity:.92}
.xp{font-weight:800;font-size:28px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.exp{border-left:3px solid var(--a);padding:2px 0 2px 12px;margin:12px 0}
.exp b{display:block}.exp small{color:var(--m)}
.fb{background:var(--bg);border:1px solid var(--l);border-radius:12px;padding:12px;font-size:13px;color:var(--m);margin-top:8px}
.empty{color:var(--m);padding:18px;text-align:center;border:1px dashed var(--l);border-radius:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--t);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.on{opacity:1}
.who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--m)}
.who select{width:auto;margin:0;padding:7px 10px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px 2px}
.msg{padding:9px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;word-break:break-word;font-size:14px;background:var(--bg);border:1px solid var(--l)}
.msg.u{align-self:flex-end;background:var(--g);color:#fff;border:0}
.vids{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
video{width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover}
.toast{max-width:90vw;text-align:center}
.tile{position:relative}.tile video{display:block}
.tile span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 9px;border-radius:8px}
.hide{display:none}.code{font-size:32px;font-weight:800;letter-spacing:.18em}
.ctr{display:flex;gap:8px;flex-wrap:wrap}
#land .lhero{text-align:center;padding:44px 0 8px}
#land h1{font-size:clamp(32px,6vw,56px);line-height:1.1;letter-spacing:-.03em;margin:16px auto;max-width:800px;font-weight:800}
#land h1 em{font-style:normal;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#land .lead{max-width:620px;margin:0 auto 22px;color:var(--m);font-size:17px}
#land .tag{display:inline-block;padding:6px 14px;border:1px solid var(--l);border-radius:99px;font-size:13px;font-weight:600;color:var(--m);background:var(--s)}
#land .track{height:8px;background:var(--l);border-radius:9px;margin-top:5px;overflow:hidden}
#land .track i{display:block;height:100%;background:var(--g)}
#land .mission{margin:36px 0 10px;text-align:center;background:var(--g);color:#fff;border-radius:22px;padding:40px 20px}
#land .mission p{max-width:600px;margin:0 auto;opacity:.93}
.logo{white-space:nowrap}.tab{padding:7px 11px}
.act{cursor:pointer;text-align:left;font:inherit;font-size:24px;color:var(--t);display:flex;flex-direction:column;gap:2px;transition:.15s}
.act b{font-size:15px}.act small{font-size:13px;color:var(--m)}.act:hover{border-color:var(--a);transform:translateY(-2px)}
.btn,.tab{transition:.15s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active,.tab:active{transform:scale(.97)}
.tab:hover{border-color:var(--a)}.tab.tut:not(.on){border-color:var(--a);color:var(--a)}
.trk{height:8px;background:var(--l);border-radius:9px;margin-top:10px;overflow:hidden}.trk i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .4s}
.av{border-radius:50%;object-fit:cover;display:block;flex:none}
.pb{margin:10px 0}.pb .row{margin:0;font-size:13px}
.dt{border-top:1px solid var(--l);padding:8px 0}.dt summary{cursor:pointer;font-size:14px}.fb ul{margin:6px 0 0;padding-left:18px}
.track{height:8px;background:var(--l);border-radius:9px;margin-top:10px;overflow:hidden}.track i{display:block;height:100%;background:var(--g);border-radius:9px}
</style>
</head>
<body>
<header><div class="w"><div class="bar">
<div class="logo" id="logo" style="cursor:pointer">Skillora <span>AI</span> <small style="font-weight:600;color:var(--m);font-size:12px">тест</small></div>
<div class="tabs" id="tabs"></div>
</div></div></header>
<main class="w" id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* Supabase: впиши URL и anon-ключ проекта (или задай window.SKILLORA_CONFIG до этого скрипта). Пока пусто — демо-режим с тестовыми данными. */
var CFG=window.SKILLORA_CONFIG||{url:"",key:""},DEMO=!CFG.url;
var FIELDS=["Маркетинг","Аналитика","Разработка","Дизайн","HR","Продажи"];
var KEY="skillora_demo_v1";
var S=null;

function seed(){return{
 tasks:[
  {id:1,company:"BrightMarket",field:"Маркетинг",title:"Контент-план для соцсетей на месяц",desc:"Составь план публикаций для молодого бренда кофе: темы, форматы, частота.",xp:120,status:"open"},
  {id:2,company:"DataNest",field:"Аналитика",title:"Анализ оттока клиентов",desc:"Найди по таблице продаж 3 причины оттока и предложи гипотезы улучшения.",xp:180,status:"open"},
  {id:3,company:"PixelForge",field:"Дизайн",title:"Редизайн экрана онбординга",desc:"Предложи улучшенный сценарий первого входа в мобильное приложение.",xp:150,status:"open"},
  {id:4,company:"CodeLab",field:"Разработка",title:"Мини-калькулятор доставки",desc:"Опиши логику и напиши код расчёта стоимости доставки по весу и расстоянию.",xp:200,status:"open"}],
 workers:[
  {id:1,name:"Алия К.",exp:[{title:"Анализ воронки продаж",company:"SellUp",field:"Продажи",score:91,xp:160},{title:"Дашборд по метрикам",company:"DataNest",field:"Аналитика",score:86,xp:180}]},
  {id:2,name:"Данияр М.",exp:[{title:"Лендинг для стартапа",company:"CodeLab",field:"Разработка",score:88,xp:200},{title:"Рефакторинг формы заявки",company:"CodeLab",field:"Разработка",score:93,xp:140}]},
  {id:3,name:"Мадина С.",exp:[{title:"Фирменный стиль для кофейни",company:"PixelForge",field:"Дизайн",score:90,xp:170}]},
  {id:4,name:"Тимур Б.",exp:[{title:"Скрининг резюме по критериям",company:"TalentHub",field:"HR",score:84,xp:110}]}],
 me:1,nextId:100};}

function load(){var x=null;try{var r=localStorage.getItem(KEY);if(r)x=JSON.parse(r)}catch(e){}return ensure(x||seed())}
function save(){try{localStorage.setItem(DEMO?KEY:KEY+"_p",JSON.stringify(DEMO?S:{tutSeen:S.tutSeen,fav:S.fav,saved:S.saved,taken:S.taken}))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="toast on";setTimeout(function(){t.className="toast"},2200)}
function me(){return S.workers.find(function(w){return w.id===S.me})||{id:S.me,name:PROF?PROF.full_name:"Гость",exp:[],hired:null}}
function totalXp(w){return w.exp.reduce(function(a,e){return a+e.xp},0)}

var tab="help",showcaseId=null,fieldF="Все",savedF=false;
var TABS=[["help","Туториал"],["land","О проекте"],["home","Платформа"],["alum","🏆 Выпускники"],["emp","Работодатель"],["stu","Студент"],["learn","Курсы и опыт"],["ai","ИИ-агент"],["call","Комнаты"]];

function renderTabs(){
 if(tab==="land"){document.getElementById("tabs").innerHTML='<button class="btn" id="enter">Начать →</button>'+(!DEMO&&ME?'<button class="tab" id="logout">Выйти</button>':'');$("enter").onclick=function(){if(!DEMO&&!(ME&&PROF)){var j=$("join");if(j)j.scrollIntoView({behavior:"smooth"});return}tab=S.tutSeen?"home":"help";render();window.scrollTo(0,0)};return}
 document.getElementById("tabs").innerHTML=tabsFor().map(function(t){return '<button class="tab'+(tab===t[0]?' on':'')+(t[0]==="help"?' tut':'')+'" data-t="'+t[0]+'">'+(t[0]==="help"?"📘 ":"")+t[1]+'</button>'}).join("")+(!DEMO&&ME?'<button class="tab" id="logout">Выйти</button>':"");
 document.querySelectorAll("#tabs [data-t]").forEach(function(b){b.onclick=function(){tab=b.dataset.t;render()}});
}

function taskCard(t,action){
 return '<div class="card"><span class="chip">'+esc(t.field)+'</span><span class="chip g">+'+t.xp+' XP</span>'+(t.demo?DC:'')+'<h3>'+esc(t.title)+'</h3><p>'+esc(t.desc)+'</p><div class="row"><small style="color:var(--m)">'+esc(t.company)+'</small>'+(action||'')+'</div></div>';
}

function pickRandom(){
 var cand=S.workers.filter(function(w){return w.exp.length&&w.id!==showcaseId});
 if(!cand.length)cand=S.workers.filter(function(w){return w.exp.length});
 showcaseId=cand.length?cand[Math.floor(Math.random()*cand.length)].id:null;
}

function renderHome(){
 if(showcaseId===null)pickRandom();
 var w=S.workers.find(function(x){return x.id===showcaseId});
 var open=S.tasks.filter(function(t){return t.status==="open"}).length;
 var done=S.workers.reduce(function(a,x){return a+x.exp.length},0);
 var h=(S.tutSeen?'':'<div class="card" style="margin-top:20px"><div class="row"><b>👋 Впервые здесь? Пройди короткий туториал</b><span><button class="btn" id="tutgo">Открыть</button> <button class="btn o" id="tutx">Скрыть</button></span></div></div>')+'<div class="hero"><h1>Опыт, подтверждённый реальными задачами</h1><p>Работодатели публикуют задания, студенты берут их в работу и получают опыт. Ниже — случайный кандидат из платформы.</p>';
 if(w){
  h+='<div class="card"><div class="row"><div style="display:flex;gap:12px;align-items:center">'+avatar(w,52)+'<div><h3 style="font-size:19px;margin:0">'+esc(w.name)+'</h3>'+(w.demo?DC:'')+'<small style="color:var(--m)">Выполнено заданий: '+w.exp.length+'</small>'+(w.hired?'<br><span class="chip g">💼 '+esc(w.hired.position)+' · '+esc(w.hired.company)+'</span>':'')+'</div></div><div class="xp">'+totalXp(w)+' XP</div></div>';
  h+=w.exp.map(function(e){return '<div class="exp"><b>'+esc(e.title)+'</b><small>'+esc(e.company)+' · '+esc(e.field)+' · оценка ИИ: '+e.score+'/100 · +'+e.xp+' XP</small></div>'}).join("");
  h+='<div class="ctr"><button class="btn o" id="rnd">🎲 Другой кандидат</button><button class="btn o" id="fav">'+(S.fav&&S.fav[w.id]?'★ В избранном':'☆ В избранное')+'</button><button class="btn" data-go="call">💬 Связаться</button></div></div>';
 } else h+='<div class="card empty">Пока нет кандидатов с опытом.</div>';
 h+='</div>';
 h+='<h2>Быстрые действия</h2><div class="grid"><button class="card act" data-go="stu">🎓<b>Взять задание</b><small>Получи опыт и XP</small></button><button class="card act" data-go="emp">🏢<b>Опубликовать задание</b><small>Найди таланты</small></button><button class="card act" data-go="ai">🤖<b>Спросить ИИ-агента</b><small>Совет за секунды</small></button><button class="card act" data-go="call">📞<b>Создать комнату</b><small>Чат, видео, экран</small></button><button class="card act" data-go="learn">🧑‍🏫<b>Курсы от специалистов</b><small>Учись у тех, кто уже на работе</small></button></div>';
 h+='<h2>Платформа сейчас</h2><div class="grid"><div class="card"><div class="xp">'+open+'</div>открытых заданий</div><div class="card"><div class="xp">'+S.workers.length+'</div>студентов</div><div class="card"><div class="xp">'+done+'</div>записей в портфолио</div></div>';
 h+='<p class="sub" style="margin-top:20px">Тестовая версия: данные хранятся только в твоём браузере. Для боевого запуска нужны регистрация и база данных (например, Supabase). <a href="#" id="reset" style="color:var(--a)">Сбросить демо</a></p>';
 return h;
}

function renderEmp(){
 var mine=S.tasks.slice().reverse();
 var h='<h2>Кабинет работодателя</h2><p class="sub">Опубликуй задание — оно сразу появится у студентов.</p><div class="cols"><div class="card"><label>Компания</label><input id="ec" placeholder="Название компании" value="'+esc(!DEMO&&PROF?PROF.company||"":"")+'"><label>Сфера</label><select id="ef">'+FIELDS.map(function(f){return '<option>'+f+'</option>'}).join("")+'</select><label>Название задания</label><input id="et" placeholder="Например: Анализ конкурентов"><label>Описание</label><textarea id="ed" placeholder="Что нужно сделать и какой результат ожидается"></textarea><label>Награда (XP)</label><input id="ex" type="number" value="100" min="10" max="500"><button class="btn" id="post">Опубликовать задание</button></div>';
 h+='<div><div class="sub" style="margin-bottom:8px">Все задания на платформе</div>'+(mine.length?mine.map(function(t){
  var st=t.status==="open"?'Открыто':t.status==="taken"?'В работе':'Выполнено';
  return taskCard(t,'<span class="ctr"><span class="chip'+(t.status==="done"?' g':'')+'">'+st+'</span>'+(t.status==="open"?'<button class="tab" data-del="'+t.id+'" title="Удалить">🗑</button>':'')+'</span>');}).join('<div style="height:10px"></div>'):'<div class="empty">Заданий пока нет</div>')+'</div></div>';
 return h;
}

function lvlBar(m){var xp=totalXp(m),lv=Math.floor(xp/300)+1;return '<div class="card" style="margin-top:12px"><div class="row"><b>🏅 Уровень '+lv+'</b><span class="sub" style="margin:0">'+xp+' XP · до следующего уровня: '+(300-xp%300)+'</span></div><div class="trk"><i style="width:'+Math.round(xp%300/3)+'%"></i></div></div>'}
/* ===== Курсы и истории опыта ===== */
var lview="courses",preCode="";
function wk(id){return S.workers.find(function(x){return x.id===id})||{name:"Участник"}}
function byLine(a){return '👤 '+esc(a.name)+(a.hired?' · '+esc(a.hired.position)+', '+esc(a.hired.company):'')}
function hiredCard(m){
 if(!DEMO)return hiredCardRemote(m);
 if(m.hired)return '<div class="card" style="margin-top:12px"><div class="row"><div style="display:flex;gap:12px;align-items:center">'+avatar(m,64)+'<div><span class="chip g">💼 Поступил на работу</span><h3 style="margin:6px 0 0">'+esc(m.hired.position)+' · '+esc(m.hired.company)+'</h3><p style="margin:4px 0 0">Теперь ты можешь проводить курсы и делиться опытом.</p><p style="margin:4px 0 0"><small>'+hiredBadge(m)+'</small></p></div></div><div class="ctr"><label class="btn o" style="cursor:pointer">📷 Фото<input type="file" id="ph" accept="image/*" hidden></label>'+(m.photo?'<button class="btn o" id="phx">Убрать фото</button>':'')+'<button class="btn" data-go="learn">🎓 Курсы и опыт</button><button class="btn o" id="unhire">Снова ищу работу</button></div></div></div>';
 return '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">🎉 Поступил на работу?</h3><p>Отметь это — и ты сможешь проводить курсы и делиться опытом с новичками.</p><div class="cols"><input id="hco" placeholder="Компания" maxlength="40"><input id="hpo" placeholder="Должность" maxlength="40"></div><button class="btn" id="hire">💼 Я поступил на работу</button></div>';
}
function renderLearn(){
 var m=me(),hr=!!m.hired;
 var h='<h2>Курсы и истории опыта</h2><p class="sub">Те, кто уже поступил на работу, проводят курсы и делятся опытом. Остальные учатся у них.</p><div class="ctr" style="margin-bottom:14px"><button class="tab'+(lview==="courses"?' on':'')+'" data-lv="courses">🎓 Курсы</button><button class="tab'+(lview==="stories"?' on':'')+'" data-lv="stories">📖 Истории</button></div>';
 if(!hr)h+='<div class="card" style="margin-bottom:14px"><b>Хочешь вести курсы и делиться опытом?</b><p style="margin:6px 0 10px">Отметь в кабинете студента, что поступил на работу.</p><button class="btn" data-go="stu">💼 Я поступил на работу</button></div>';
 if(lview==="courses"){
  if(hr)h+='<div class="card" style="margin-bottom:14px"><h3 style="margin:0 0 10px">➕ Новый курс</h3><div class="cols"><div><label>Название</label><input id="ct" maxlength="70"></div><div><label>Сфера</label><select id="cf">'+FIELDS.map(function(f){return '<option>'+f+'</option>'}).join("")+'</select></div></div><label>Описание</label><textarea id="cd" maxlength="400"></textarea><label>Когда проходит</label><input id="cw" maxlength="40" placeholder="Например: сб, 18:00"><button class="btn" id="pubc">Опубликовать курс</button></div>';
  h+=S.courses.length?'<div class="grid">'+S.courses.slice().reverse().map(function(c){
   var a=wk(c.author),mine=c.author===m.id,en=c.enrolled.indexOf(m.id)>-1;

var R=null,N=null,code=null,roomPeers=[],conns={},localStream=null,screenStream=null,screenSeen={},chatLog=[],sigBuf={};
var ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
var canScreen=!!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia);
async function initRoom(){
 try{R=window.claude?await claude.use("room"):null}catch(e){R=null}
 if(tab==="call"&&!N)render();
}
function myPeer(){return N&&N.peers().find(function(x){return x.isMe&&x.sameTab})}
function peerOf(pid){return roomPeers.find(function(p){return p.peer===pid})}
function pnm(p){return p&&p.presence&&p.presence.name?String(p.presence.name).slice(0,40):"Участник"}
function genCode(){return String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000)}

async function enterRoom(c){
 c=String(c||"").replace(/\D/g,"");
 if(c.length!==6){toast("Код — 6 цифр");return}
 var n=$("cn").value.trim();if(!n){toast("Введи имя");return}
 S.ident={name:n.slice(0,40),role:$("cr").value};save();
 try{N=await R.join("m"+c)}catch(e){N=null;toast("Не удалось войти в комнату");return}
 code=c;preCode="";chatLog=[];conns={};
 N.on("sig",onSig);
 N.on("chat",function(m){var d=m.data||{};chatLog.push({n:String(d.n||"Участник").slice(0,40),t:String(d.t||"").slice(0,500),me:m.isMe});drawChat()});
 N.onPeers(onPeersChange);
 N.presence({name:S.ident.name,role:S.ident.role});
 roomPeers=N.peers().slice();render();
}
function onPeersChange(ch){
 roomPeers=ch.peers.slice();
 ch.left.forEach(function(p){closeConn(p.peer)});
 if(localStream||screenStream)roomPeers.forEach(function(p){if(!p.isMe)connect(p.peer)});
 drawPeers();drawTiles();drawCtl();
}
function leaveRoom(){
 stopScreen(true);stopCall(true);
 Object.keys(conns).forEach(closeConn);
 try{N.leave()}catch(e){}
 N=null;code=null;roomPeers=[];render();
}

/* --- WebRTC (mesh, perfect negotiation) --- */
function sig(to,t,data){
 var s=JSON.stringify(data||{}),id=Math.random().toString(36).slice(2,8),n=Math.ceil(s.length/2500)||1;
 for(var i=0;i<n;i++)N.emit("sig",{to:to,t:t,id:id,i:i,n:n,p:s.slice(i*2500,(i+1)*2500)});
}
function onSig(m){
 var d=m.data,me=myPeer();if(!d||m.isMe||!me||d.to!==me.peer)return;
 var k=m.peer+d.id,b=sigBuf[k]=sigBuf[k]||{c:0,p:[]};
 if(b.p[d.i]===undefined){b.p[d.i]=d.p;b.c++}
 if(b.c<d.n)return;
 delete sigBuf[k];
 var data;try{data=JSON.parse(b.p.join(""))}catch(e){return}
 if(d.t==="desc")onDesc(m.peer,data);else if(d.t==="ice")onIce(m.peer,data);
}
function getConn(pid){
 if(conns[pid])return conns[pid];
 var me=myPeer(),pc=new RTCPeerConnection(ICE);
 var cn=conns[pid]={pc:pc,streams:{},making:false,ignore:false,iceQ:[],polite:!!me&&me.peer>pid};
 pc.onicecandidate=function(e){if(e.candidate&&N)sig(pid,"ice",e.candidate.toJSON())};
 pc.ontrack=function(e){
  var s=e.streams[0];if(!s)return;cn.streams[s.id]=s;
  s.onremovetrack=function(){if(!s.getTracks().length){delete cn.streams[s.id];drawTiles()}};
  e.track.onended=function(){drawTiles()};drawTiles();
 };
 pc.onnegotiationneeded=async function(){
  try{cn.making=true;await pc.setLocalDescription();sig(pid,"desc",pc.localDescription.toJSON())}catch(e){}finally{cn.making=false}
 };
 return cn;
}
function addLocal(cn){
 [localStream,screenStream].forEach(function(st){
  if(!st)return;
  st.getTracks().forEach(function(t){if(!cn.pc.getSenders().some(function(s){return s.track===t}))cn.pc.addTrack(t,st)});
 });
}
function connect(pid){var cn=getConn(pid);addLocal(cn)}
function closeConn(pid){var cn=conns[pid];if(!cn)return;try{cn.pc.close()}catch(e){}delete conns[pid];drawTiles()}
async function onDesc(from,desc){
 try{
  var cn=getConn(from),pc=cn.pc;
  var coll=desc.type==="offer"&&(cn.making||pc.signalingState!=="stable");
  cn.ignore=!cn.polite&&coll;if(cn.ignore)return;
  await pc.setRemoteDescription(desc);
  while(cn.iceQ.length)await pc.addIceCandidate(cn.iceQ.shift()).catch(function(){});
  if(desc.type==="offer"){await pc.setLocalDescription();sig(from,"desc",pc.localDescription.toJSON())}
 }catch(e){}
}
async function onIce(from,c){
 var cn=getConn(from);
 if(cn.pc.remoteDescription)await cn.pc.addIceCandidate(c).catch(function(){});
 else cn.iceQ.push(c);
}

/* --- звонок и экран --- */
async function startCall(){
 try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true})}
 catch(e){try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});toast("Камера недоступна — только звук")}catch(e2){toast("Нет доступа к микрофону или камере");return}}
 N.presence({call:true});
 roomPeers.forEach(function(p){if(!p.isMe)connect(p.peer)});
 Object.keys(conns).forEach(function(k){addLocal(conns[k])});
 drawTiles();drawCtl();
}
function dropTracks(st){
 if(!st)return;
 Object.keys(conns).forEach(function(k){conns[k].pc.getSenders().forEach(function(s){if(s.track&&st.getTracks().indexOf(s.track)>-1){try{conns[k].pc.removeTrack(s)}catch(e){}}})});
 st.getTracks().forEach(function(t){t.stop()});
}
function stopCall(quiet){
 dropTracks(localStream);localStream=null;
 if(N&&!quiet){N.presence({call:null});drawTiles();drawCtl()}
}
async function startScreen(){
 try{screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false})}catch(e){screenStream=null;toast("Не удалось начать демонстрацию экрана");return}
 screenStream.getVideoTracks()[0].onended=function(){stopScreen()};
 N.presence({screen:screenStream.id});
 roomPeers.forEach(function(p){if(!p.isMe)connect(p.peer)});
 Object.keys(conns).forEach(function(k){addLocal(conns[k])});
 drawTiles();drawCtl();
}
function stopScreen(quiet){
 dropTracks(screenStream);screenStream=null;
 if(N&&!quiet){N.presence({screen:null});drawTiles();drawCtl()}
}

function setTile(c,key,label,stream,muted,scr){
 var t=[].slice.call(c.children).find(function(x){return x.dataset.k===key});
 if(!t){t=document.createElement("div");t.className="tile";t.dataset.k=key;t.innerHTML='<video autoplay playsinline></video><span></span>';c.appendChild(t)}
 var v=t.firstChild;v.muted=!!muted;v.style.objectFit=scr?"contain":"cover";
 if(v.srcObject!==stream)v.srcObject=stream;
 t.lastChild.textContent=label;
}
function drawTiles(){
 var c=$("tiles");if(!c)return;var keep={};
 if(localStream){keep.me=1;setTile(c,"me","Ты",localStream,true,false)}
 if(screenStream){keep.ms=1;setTile(c,"ms","Твой экран",screenStream,true,true)}
 Object.keys(conns).forEach(function(pid){
  var p=peerOf(pid),cn=conns[pid];
  Object.keys(cn.streams).forEach(function(sid){
   var live=p&&p.presence&&p.presence.screen===sid;
   if(live)screenSeen[sid]=1;
   if(screenSeen[sid]&&!live)return;
   var k=pid+sid;keep[k]=1;setTile(c,k,pnm(p)+(live?" — экран":""),cn.streams[sid],false,live);
  });
 });
 [].slice.call(c.children).forEach(function(t){if(!keep[t.dataset.k])c.removeChild(t)});
 c.classList.toggle("hide",c.children.length===0);
}
